<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postlain Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Auth Screen */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: #0f1117;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-overlay.hidden { display: none !important; }
    .auth-box {
      background: #181b24;
      border: 1px solid #272c3d;
      border-radius: 8px;
      padding: 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .auth-input {
      width: 100%;
      padding: 10px;
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-align: center;
      background: #0d0e14;
      border: 1px solid #272c3d;
      border-radius: 6px;
      color: #fff;
      margin: 16px 0;
      outline: none;
    }
    .auth-input:focus { border-color: #3b82f6; }

    /* Layout */
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-sidebar {
      width: 220px;
      background: #141720;
      border-right: 1px solid #212534;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-title { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 20px; }
    .nav-list { display: flex; flex-direction: column; gap: 4px; }
    .nav-tab-btn {
      padding: 8px 12px;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .nav-tab-btn:hover, .nav-tab-btn.active { background: #212636; color: #fff; }
    .nav-tab-btn.active { color: #3b82f6; }

    .admin-content { flex: 1; padding: 28px 36px; overflow-y: auto; }
    .page-heading { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 20px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #212636; color: #cbd5e1; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 0.78rem; }

    /* Table */
    .table-container {
      background: #141720;
      border: 1px solid #212534;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 14px;
    }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th {
      background: #181c27;
      padding: 12px 16px;
      font-size: 0.78rem;
      color: #94a3b8;
      border-bottom: 1px solid #212534;
    }
    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #1a1e2b;
      font-size: 0.88rem;
    }
    .data-table tr:hover td { background: #181c28; }

    /* Forms */
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: #94a3b8; }
    .form-control {
      width: 100%;
      padding: 8px 12px;
      background: #0d0e14;
      border: 1px solid #272c3d;
      border-radius: 6px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }
    .form-control:focus { border-color: #3b82f6; }

    .tab-section { display: none; }
    .tab-section.active { display: block; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex !important; }
    .modal-box {
      background: #181b24;
      border: 1px solid #272c3d;
      border-radius: 8px;
      max-width: 520px;
      width: 100%;
    }
    .modal-head {
      padding: 14px 18px;
      border-bottom: 1px solid #272c3d;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-body { padding: 18px; }
    .modal-foot {
      padding: 12px 18px;
      border-top: 1px solid #272c3d;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #181b24;
      border: 1px solid #3b82f6;
      padding: 10px 18px;
      border-radius: 6px;
      color: #fff;
      display: none;
      z-index: 10000;
    }
  </style>
</head>
<body>
  <!-- PIN Gate -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-box">
      <h2 style="color: #fff; margin-bottom: 6px;">Postlain Admin</h2>
      <p style="color: #94a3b8; font-size: 0.85rem;">Nhập mã PIN truy cập</p>
      <input type="password" id="pin-input" class="auth-input" placeholder="••••" maxlength="8" autofocus>
      <button id="pin-submit" class="btn btn-primary" style="width: 100%;">ĐĂNG NHẬP</button>
      <div style="font-size: 0.75rem; color: #64748b; margin-top: 10px;">Mặc định: 1234</div>
    </div>
  </div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div>
        <div class="sidebar-title">Postlain Admin</div>
        <nav class="nav-list">
          <button class="nav-tab-btn active" data-tab="portals">Danh Sách Website</button>
          <button class="nav-tab-btn" data-tab="about">Soạn Thảo About</button>
          <button class="nav-tab-btn" data-tab="backup">Sao Lưu & JSON</button>
        </nav>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <a href="/" target="_blank" class="btn btn-secondary btn-sm" style="width: 100%; text-align: center;">Xem Trang Chủ</a>
        <button id="btn-logout" class="btn btn-danger btn-sm" style="width: 100%;">Đăng Xuất</button>
      </div>
    </aside>

    <main class="admin-content">
      <!-- TAB 1: PORTALS -->
      <section id="tab-portals" class="tab-section active">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h1 class="page-heading" style="margin: 0;">Quản Lý Cổng Website</h1>
          <button id="btn-add-portal" class="btn btn-primary">+ Thêm Website Mới</button>
        </div>

        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 50px;">#</th>
                <th>Tên Website & URL</th>
                <th>1 Dòng Giới Thiệu</th>
                <th style="width: 120px;">Thao Tác</th>
              </tr>
            </thead>
            <tbody id="portals-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- TAB 2: ABOUT -->
      <section id="tab-about" class="tab-section">
        <h1 class="page-heading">Soạn Thảo Giới Thiệu (About)</h1>
        <form id="about-form" style="max-width: 680px;">
          <div class="form-group">
            <label>Tiêu Đề</label>
            <input type="text" id="about-title-input" class="form-control">
          </div>
          <div class="form-group">
            <label>Bí Danh (Alias)</label>
            <input type="text" id="about-alias-input" class="form-control">
          </div>
          <div class="form-group">
            <label>Trích Dẫn (Quote)</label>
            <input type="text" id="about-quote-input" class="form-control">
          </div>
          <div class="form-group">
            <label>Nội Dung</label>
            <textarea id="about-content-input" class="form-control" rows="8"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Lưu Nội Dung About</button>
        </form>
      </section>

      <!-- TAB 3: BACKUP -->
      <section id="tab-backup" class="tab-section">
        <h1 class="page-heading">Xuất & Sao Lưu JSON</h1>
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <button id="btn-download-json" class="btn btn-primary">Tải portals.json</button>
          <button id="btn-copy-json" class="btn btn-secondary">Sao Chép JSON</button>
        </div>
        <div class="form-group" style="max-width: 480px; margin-bottom: 16px;">
          <label>Nhập file JSON dự phòng:</label>
          <input type="file" id="import-json-file" accept=".json">
        </div>
        <pre id="json-preview" style="background: #0d0e14; border: 1px solid #212534; padding: 14px; border-radius: 6px; font-size: 0.8rem; color: #38bdf8; max-height: 340px; overflow-y: auto;"></pre>
      </section>
    </main>
  </div>

  <!-- MODAL: ADD/EDIT -->
  <div id="modal-portal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title" style="font-size: 1rem; color: #fff;">Thêm Website Mới</h3>
        <button type="button" class="btn-close-modal" style="background: transparent; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <form id="portal-form">
        <div class="modal-body">
          <input type="hidden" id="portal-id">
          <div class="form-group">
            <label>Tên Website *</label>
            <input type="text" id="portal-title" class="form-control" placeholder="VD: Hidden Music" required>
          </div>
          <div class="form-group">
            <label>Đường Dẫn URL *</label>
            <input type="url" id="portal-url" class="form-control" placeholder="https://hiddenmusic.postlain.com" required>
          </div>
          <div class="form-group">
            <label>1 Dòng Giới Thiệu (Tagline) *</label>
            <input type="text" id="portal-tagline" class="form-control" placeholder="VD: Nền tảng phát nhạc độc lập." required>
          </div>
          <div class="form-group">
            <label>Link Ảnh Chụp Màn Hình (Tùy chọn)</label>
            <input type="text" id="portal-image" class="form-control" placeholder="https://... (để trống nếu dùng giao diện live)">
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-secondary btn-close-modal">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu Website</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-msg" class="toast"></div>

  <script>
    const STORAGE_KEY = 'postlain_data_v6';
    const AUTH_KEY = 'postlain_admin_logged_v6';
    const DEFAULT_PIN = '1234';

    const DEFAULT_DATA = {
      about: {
        title: "Giới Thiệu // The Architect",
        alias: "ANONYMOUS_CREATOR",
        quote: "Trong một thế giới đầy rẫy sự kiểm soát, chúng ta kiến tạo những không gian tự do.",
        content: "Tôi là một kẻ ẩn danh đứng sau những dòng mã và những tần số âm thanh của Postlain.\n\nMục đích duy nhất của tôi khi tạo ra chuỗi website và công cụ này là thiết lập một mạng lưới độc lập – nơi bất kỳ ai cũng có thể sáng tạo âm nhạc chất lượng phòng thu, khai thác sức mạnh của trí tuệ nhân tạo, và kết nối với những người cùng tần số mà không bị ràng buộc bởi bất kỳ nền tảng độc quyền nào.\n\nMỗi cổng kết nối là một công cụ độc lập được trau chuốt tỉ mỉ. Hãy sử dụng những công cụ này để tạo nên những điều phi thường."
      },
      portals: [
        { id: "hidden-music", title: "Hidden Music", url: "https://hiddenmusic.postlain.com", tagline: "Nền tảng phát nhạc độc lập dành riêng cho cộng đồng ngầm.", image: "" },
        { id: "postlain-music", title: "Postlain Music", url: "https://music.postlain.com", tagline: "Dịch vụ stream âm thanh Hi-Res Lossless 24-bit chất lượng cao.", image: "" },
        { id: "studio-daw", title: "Studio DAW", url: "https://studio.postlain.com", tagline: "Trạm thu âm & phối khí trực tuyến trên trình duyệt.", image: "" },
        { id: "ai-sound-lab", title: "AI Sound Lab", url: "https://ai.postlain.com", tagline: "Công cụ tách Stem giọng hát và xử lý phổ âm thanh bằng AI.", image: "" },
        { id: "sound-vault", title: "Sound Vault", url: "https://store.postlain.com", tagline: "Kho sample kit, preset synthesizer và thư viện âm thanh bản quyền.", image: "" },
        { id: "hub-community", title: "Hub Community", url: "https://hub.postlain.com", tagline: "Mạng lưới kết nối giữa các nhà sản xuất âm nhạc và lập trình viên.", image: "" },
        { id: "audio-suite", title: "Audio Suite", url: "https://tools.postlain.com", tagline: "Bộ công cụ cắt ghép, chuyển đổi định dạng và tối ưu metadata audio.", image: "" },
        { id: "lyric-sync", title: "Lyric Sync", url: "https://lyrics.postlain.com", tagline: "Trình đồng bộ lời bài hát (.lrc / .srt) thời gian thực.", image: "" }
      ]
    };

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.portals) && parsed.portals.length > 0) return parsed;
        }
      } catch (e) {}
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
      return DEFAULT_DATA;
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function notify(msg) {
      const el = document.getElementById('toast-msg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 2200);
    }

    document.addEventListener('DOMContentLoaded', () => {
      let currentData = loadData();

      const authOverlay = document.getElementById('auth-overlay');
      const pinInput = document.getElementById('pin-input');
      const pinSubmit = document.getElementById('pin-submit');
      const btnLogout = document.getElementById('btn-logout');

      const navBtns = document.querySelectorAll('.nav-tab-btn');
      const tabSections = document.querySelectorAll('.tab-section');

      const tbody = document.getElementById('portals-tbody');
      const btnAdd = document.getElementById('btn-add-portal');
      const modal = document.getElementById('modal-portal');
      const modalTitle = document.getElementById('modal-title');
      const form = document.getElementById('portal-form');
      const inpId = document.getElementById('portal-id');
      const inpTitle = document.getElementById('portal-title');
      const inpUrl = document.getElementById('portal-url');
      const inpTagline = document.getElementById('portal-tagline');
      const inpImage = document.getElementById('portal-image');

      const aboutForm = document.getElementById('about-form');
      const inpAboutTitle = document.getElementById('about-title-input');
      const inpAboutAlias = document.getElementById('about-alias-input');
      const inpAboutQuote = document.getElementById('about-quote-input');
      const inpAboutContent = document.getElementById('about-content-input');

      const jsonPreview = document.getElementById('json-preview');
      const btnCopyJson = document.getElementById('btn-copy-json');
      const btnDownloadJson = document.getElementById('btn-download-json');
      const inpImport = document.getElementById('import-json-file');

      function checkAuth() {
        if (sessionStorage.getItem(AUTH_KEY) === 'true') {
          authOverlay.classList.add('hidden');
          renderAll();
        } else {
          authOverlay.classList.remove('hidden');
          pinInput.value = '';
          pinInput.focus();
        }
      }

      pinSubmit.addEventListener('click', () => {
        if (pinInput.value.trim() === DEFAULT_PIN) {
          sessionStorage.setItem(AUTH_KEY, 'true');
          authOverlay.classList.add('hidden');
          renderAll();
          notify('Đăng nhập thành công!');
        } else {
          alert('Mã PIN không đúng.');
          pinInput.value = '';
          pinInput.focus();
        }
      });

      pinInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') pinSubmit.click();
      });

      btnLogout.addEventListener('click', () => {
        sessionStorage.removeItem(AUTH_KEY);
        checkAuth();
      });

      // Tabs
      navBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.getAttribute('data-tab');
          navBtns.forEach(b => b.classList.remove('active'));
          tabSections.forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-' + tab).classList.add('active');
          if (tab === 'backup') renderJson();
        });
      });

      function renderTable() {
        currentData = loadData();
        tbody.innerHTML = currentData.portals.map((p, idx) => `
          <tr>
            <td style="font-weight: 700; color: #94a3b8;">${idx + 1}</td>
            <td>
              <div style="font-weight: 700; color: #fff;">${p.title}</div>
              <div style="font-size: 0.78rem; color: #64748b; font-family: monospace;">${p.url}</div>
            </td>
            <td style="color: #cbd5e1;">${p.tagline || ''}</td>
            <td>
              <div style="display: flex; gap: 6px;">
                <button class="btn btn-secondary btn-sm" onclick="editPortal('${p.id}')">Sửa</button>
                <button class="btn btn-danger btn-sm" onclick="deletePortal('${p.id}')">Xóa</button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      window.editPortal = function(id) {
        const p = currentData.portals.find(item => item.id === id);
        if (!p) return;
        modalTitle.textContent = 'Chỉnh Sửa Website';
        inpId.value = p.id;
        inpTitle.value = p.title || '';
        inpUrl.value = p.url || '';
        inpTagline.value = p.tagline || '';
        inpImage.value = p.image || '';
        modal.classList.add('active');
      };

      window.deletePortal = function(id) {
        if (confirm('Bạn có chắc muốn xóa cổng này?')) {
          currentData.portals = currentData.portals.filter(p => p.id !== id);
          saveData(currentData);
          renderTable();
          notify('Đã xóa thành công!');
        }
      };

      btnAdd.addEventListener('click', () => {
        modalTitle.textContent = 'Thêm Website Mới';
        form.reset();
        inpId.value = '';
        modal.classList.add('active');
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = inpId.value.trim();
        const title = inpTitle.value.trim();
        const url = inpUrl.value.trim();
        const tagline = inpTagline.value.trim();
        const image = inpImage.value.trim();

        if (id) {
          const idx = currentData.portals.findIndex(p => p.id === id);
          if (idx >= 0) currentData.portals[idx] = { id, title, url, tagline, image };
        } else {
          currentData.portals.push({ id: 'site-' + Date.now(), title, url, tagline, image });
        }

        saveData(currentData);
        modal.classList.remove('active');
        renderTable();
        notify('Đã lưu website thành công!');
      });

      function renderAbout() {
        const a = currentData.about || DEFAULT_DATA.about;
        inpAboutTitle.value = a.title || '';
        inpAboutAlias.value = a.alias || '';
        inpAboutQuote.value = a.quote || '';
        inpAboutContent.value = a.content || '';
      }

      aboutForm.addEventListener('submit', (e) => {
        e.preventDefault();
        currentData.about = {
          title: inpAboutTitle.value.trim(),
          alias: inpAboutAlias.value.trim(),
          quote: inpAboutQuote.value.trim(),
          content: inpAboutContent.value.trim()
        };
        saveData(currentData);
        notify('Đã lưu nội dung About!');
      });

      function renderJson() {
        jsonPreview.textContent = JSON.stringify(currentData, null, 2);
      }

      btnCopyJson.addEventListener('click', () => {
        navigator.clipboard.writeText(JSON.stringify(currentData, null, 2)).then(() => notify('Đã sao chép JSON!'));
      });

      btnDownloadJson.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'portals.json';
        a.click();
        notify('Đã tải file portals.json!');
      });

      inpImport.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed && Array.isArray(parsed.portals)) {
              currentData = parsed;
              saveData(currentData);
              renderAll();
              notify('Nhập JSON thành công!');
            }
          } catch(err) { alert('Lỗi file JSON'); }
        };
        r.readAsText(file);
      });

      document.querySelectorAll('.btn-close-modal').forEach(btn => {
        btn.addEventListener('click', () => modal.classList.remove('active'));
      });

      function renderAll() {
        renderTable();
        renderAbout();
        renderJson();
      }

      checkAuth();
    });
  </script>
</body>
</html>
