<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>POSTLAIN // MASTER GATEWAY</title>
  <meta name="description" content="Cổng kết nối hệ sinh thái Postlain.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- Ambient Cyber Background -->
  <div class="cyber-canvas-bg">
    <div class="perspective-grid"></div>
    <div class="ambient-scanline"></div>
  </div>

  <!-- Master App -->
  <div class="cyber-app">
    <!-- NÚT CHUYỂN ĐỔI NHỎ GỌN TRỰC TIẾP GIỮA MASTER GATE VÀ ABOUT -->
    <div class="minimal-switcher-bar">
      <div class="minimal-switcher">
        <button id="mode-gate-btn" class="mini-switch-btn active" title="Cổng kết nối Master Gate">
          <i data-lucide="grid" style="width: 15px; height: 15px;"></i>
          <span>MASTER GATE</span>
        </button>
        <button id="mode-about-btn" class="mini-switch-btn" title="Hồ sơ Kẻ Ẩn Danh">
          <i data-lucide="user-x" style="width: 15px; height: 15px;"></i>
          <span>ABOUT</span>
        </button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main>
      <!-- PHẦN 1: MASTER GATE (CÁC HÌNH VUÔNG THẬT TO) -->
      <section id="section-gate" class="section-view active">
        <div id="big-square-grid" class="big-square-grid">
          <!-- Injected via JavaScript -->
        </div>
      </section>

      <!-- PHẦN 2: ABOUT (HỒ SƠ KẺ ẨN DANH) -->
      <section id="section-about" class="section-view">
        <div class="about-manifesto-container">
          <h1 id="about-title" class="about-title">HỒ SƠ KẺ ẨN DANH // THE ARCHITECT</h1>
          <div id="about-alias" class="about-alias">[ BÍ DANH: ANONYMOUS_ARCHITECT ]</div>

          <div id="about-quote" class="about-quote-box">
            "Trong một thế giới đầy rẫy sự kiểm soát, chúng ta kiến tạo những không gian tự do."
          </div>

          <div id="about-content" class="about-content-text">
            <!-- Injected via JavaScript / Admin -->
          </div>
        </div>
      </section>
    </main>

    <!-- BẢNG XEM TRƯỚC PHÓNG TO 50% GIỮA MÀN HÌNH KHI ĐƯA CHUỘT VÀO Ô VUÔNG -->
    <div id="center-preview-backdrop" class="center-preview-backdrop">
      <div id="center-preview-panel" class="center-preview-panel">
        <!-- Top Bar -->
        <div class="preview-top-bar">
          <div id="preview-feed-id" class="preview-feed-id">[ DIRECT_FEED // GATE_01 ]</div>
          <button id="preview-close-btn" class="preview-close-btn" title="Đóng">
            <i data-lucide="x" style="width: 16px; height: 16px;"></i>
          </button>
        </div>

        <!-- Body -->
        <div class="preview-body">
          <!-- Bảng xem trước website -->
          <div id="preview-mockup-screen" class="preview-mockup-screen">
            <div class="preview-scanbeam"></div>
            <div id="preview-screen-content" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
              <!-- Injected via JS -->
            </div>
          </div>

          <!-- 1 Dòng Giới Thiệu Cốt Lõi -->
          <div class="preview-tagline-box">
            <div class="tagline-label">// GIỚI THIỆU:</div>
            <div id="preview-tagline-text" class="tagline-text"></div>
          </div>
        </div>

        <!-- Footer -->
        <div class="preview-footer">
          <div id="preview-url-text" style="font-family: var(--font-mono); font-size: 0.85rem; color: #94a3b8;">
            https://...
          </div>
          <a id="preview-launch-btn" href="#" target="_blank" rel="noopener noreferrer" class="launch-btn-cyber">
            <span>TRUY CẬP WEBSITE</span>
            <i data-lucide="arrow-up-right" style="width: 18px; height: 18px;"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./js/store.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
