<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>POSTLAIN // MASTER GATEWAY</title>
  <meta name="description" content="Cổng kết nối hệ sinh thái Postlain.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; color-scheme: dark; background-color: #040406; }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #040406;
      color: #fff;
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Background */
    .cyber-canvas-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .perspective-grid {
      position: absolute;
      bottom: -35%;
      left: -50%;
      width: 200%;
      height: 120%;
      background-image: 
        linear-gradient(rgba(255, 0, 60, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 60, 0.08) 1px, transparent 1px);
      background-size: 80px 80px;
      transform: perspective(600px) rotateX(65deg);
      transform-origin: center bottom;
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, rgba(0,0,0,0) 80%);
    }
    .ambient-scanline {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.3) 51%);
      background-size: 100% 4px;
      opacity: 0.5;
    }

    /* App Container */
    .cyber-app {
      position: relative;
      z-index: 1;
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 32px 60px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Small Minimalist Switcher */
    .minimal-switcher-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 36px;
    }
    .minimal-switcher {
      display: inline-flex;
      align-items: center;
      background: rgba(14, 14, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px;
      border-radius: 6px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      gap: 4px;
    }
    .mini-switch-btn {
      padding: 8px 22px;
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .mini-switch-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .mini-switch-btn.active {
      background: #ff003c;
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 0, 60, 0.6);
      border-color: #ff1e4b;
    }

    /* Views */
    .section-view { display: none; animation: smoothFade 0.3s ease-out; }
    .section-view.active { display: block; }
    @keyframes smoothFade {
      from { opacity: 0; transform: scale(0.98) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Big Square Grid */
    .big-square-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 32px;
      perspective: 1200px;
    }
    .big-square-card {
      position: relative;
      aspect-ratio: 1 / 1;
      background: rgba(16, 16, 22, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #ff003c;
      border-radius: 8px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      transform-style: preserve-3d;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }
    .big-square-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(255, 0, 60, 0.15) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }
    .big-square-card:hover {
      border-color: #ff003c;
      background: rgba(24, 24, 34, 0.95);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(255, 0, 60, 0.4);
      transform: translateY(-8px) scale(1.03);
    }
    .big-square-card:hover::before { opacity: 1; }

    .card-top-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: #94a3b8;
    }
    .card-index { color: #ff003c; font-weight: 700; }
    .card-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.72rem;
    }
    .card-status-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff003c;
      box-shadow: 0 0 8px #ff003c;
    }

    .card-center-reactor {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }
    .big-reactor-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e1e2c, #0e0e16);
      border: 2px solid rgba(255, 0, 60, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 25px rgba(255, 0, 60, 0.35);
      transition: all 0.3s ease;
    }
    .big-square-card:hover .big-reactor-icon {
      transform: scale(1.12) rotate(6deg);
      border-color: #ff003c;
      color: #ff003c;
      box-shadow: 0 0 40px rgba(255, 0, 60, 0.75);
    }
    .big-card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .card-bottom-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
    }
    .hover-open-hint {
      color: #ff003c;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.2s ease;
    }
    .big-square-card:hover .hover-open-hint { transform: translateX(4px); }

    /* Center 50% Zoom Modal */
    .center-preview-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 6, 0.88);
      backdrop-filter: blur(20px);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .center-preview-backdrop.active { opacity: 1; visibility: visible; }
    .center-preview-panel {
      width: min(840px, 86vw);
      max-height: min(600px, 80vh);
      background: #0d0d14;
      border: 1px solid #ff003c;
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 0 0 50px rgba(255, 0, 60, 0.45);
      display: flex;
      flex-direction: column;
      position: relative;
      transform: scale(0.88) translateY(20px);
      transition: all 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }
    .center-preview-backdrop.active .center-preview-panel { transform: scale(1) translateY(0); }

    .preview-top-bar {
      padding: 16px 24px;
      background: #13131c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .preview-feed-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #ff003c;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .preview-close-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .preview-close-btn:hover { background: #ff003c; border-color: #ff003c; }

    .preview-body {
      padding: 24px 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .preview-mockup-screen {
      width: 100%;
      height: 220px;
      background: #060609;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
    }
    .preview-scanbeam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff003c, transparent);
      box-shadow: 0 0 15px #ff003c;
      animation: scanbeamMove 2.8s linear infinite;
      pointer-events: none;
    }
    @keyframes scanbeamMove { 0% { top: 0; } 100% { top: 100%; } }

    .preview-tagline-box {
      background: rgba(255, 0, 60, 0.08);
      border: 1px solid rgba(255, 0, 60, 0.4);
      border-left: 4px solid #ff003c;
      border-radius: 6px;
      padding: 16px 20px;
    }
    .tagline-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #ff003c;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .tagline-text { font-size: 1.1rem; font-weight: 700; color: #fff; line-height: 1.5; }

    .preview-footer {
      padding: 18px 28px;
      background: #101017;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .launch-btn-cyber {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 34px;
      background: #ff003c;
      border: 1px solid #ff1e4b;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-decoration: none;
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(255, 0, 60, 0.6);
      transition: all 0.2s ease;
    }
    .launch-btn-cyber:hover { background: #ff1e4b; box-shadow: 0 0 45px rgba(255, 0, 60, 0.9); transform: translateY(-2px); }

    /* About Section */
    .about-manifesto-container {
      max-width: 900px;
      margin: 20px auto 40px;
      background: rgba(16, 16, 22, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 3px solid #ff003c;
      border-radius: 12px;
      padding: 44px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }
    .about-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .about-alias {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      color: #ff003c;
      margin-bottom: 24px;
    }
    .about-quote-box {
      background: rgba(255, 0, 60, 0.08);
      border-left: 4px solid #ff003c;
      padding: 18px 24px;
      font-size: 1.15rem;
      font-style: italic;
      color: #fff;
      line-height: 1.6;
      border-radius: 4px;
      margin-bottom: 28px;
    }
    .about-content-text {
      font-size: 1.05rem;
      color: #cbd5e1;
      line-height: 1.85;
      white-space: pre-line;
    }

    @media (max-width: 768px) {
      .cyber-app { padding: 16px; }
      .big-square-grid { grid-template-columns: 1fr; gap: 20px; }
      .center-preview-panel { width: 95vw; max-height: 88vh; }
      .about-manifesto-container { padding: 24px; }
    }
  </style>
</head>
<body>
  <!-- Ambient Cyber Background -->
  <div class="cyber-canvas-bg">
    <div class="perspective-grid"></div>
    <div class="ambient-scanline"></div>
  </div>

  <!-- Master App -->
  <div class="cyber-app">
    <!-- NÚT CHUYỂN ĐỔI NHỎ GỌN TRỰC TIẾP -->
    <div class="minimal-switcher-bar">
      <div class="minimal-switcher">
        <button id="mode-gate-btn" class="mini-switch-btn active">
          <i data-lucide="grid" style="width: 15px; height: 15px;"></i>
          <span>MASTER GATE</span>
        </button>
        <button id="mode-about-btn" class="mini-switch-btn">
          <i data-lucide="user-x" style="width: 15px; height: 15px;"></i>
          <span>ABOUT</span>
        </button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main>
      <!-- PHẦN 1: MASTER GATE (CÁC HÌNH VUÔNG THẬT TO) -->
      <section id="section-gate" class="section-view active">
        <div id="big-square-grid" class="big-square-grid"></div>
      </section>

      <!-- PHẦN 2: ABOUT (HỒ SƠ KẺ ẨN DANH) -->
      <section id="section-about" class="section-view">
        <div class="about-manifesto-container">
          <h1 id="about-title" class="about-title">HỒ SƠ KẺ ẨN DANH // THE ARCHITECT</h1>
          <div id="about-alias" class="about-alias">[ BÍ DANH: ANONYMOUS_ARCHITECT ]</div>
          <div id="about-quote" class="about-quote-box"></div>
          <div id="about-content" class="about-content-text"></div>
        </div>
      </section>
    </main>

    <!-- BẢNG XEM TRƯỚC PHÓNG TO 50% GIỮA MÀN HÌNH -->
    <div id="center-preview-backdrop" class="center-preview-backdrop">
      <div id="center-preview-panel" class="center-preview-panel">
        <div class="preview-top-bar">
          <div id="preview-feed-id" class="preview-feed-id">[ DIRECT_FEED // GATE_01 ]</div>
          <button id="preview-close-btn" class="preview-close-btn" title="Đóng">✕</button>
        </div>

        <div class="preview-body">
          <div class="preview-mockup-screen">
            <div class="preview-scanbeam"></div>
            <div id="preview-screen-content" style="display: flex; flex-direction: column; align-items: center; gap: 8px;"></div>
          </div>

          <div class="preview-tagline-box">
            <div class="tagline-label">// GIỚI THIỆU:</div>
            <div id="preview-tagline-text" class="tagline-text"></div>
          </div>
        </div>

        <div class="preview-footer">
          <div id="preview-url-text" style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #94a3b8;">https://...</div>
          <a id="preview-launch-btn" href="#" target="_blank" rel="noopener noreferrer" class="launch-btn-cyber">
            <span>TRUY CẬP WEBSITE</span>
            <i data-lucide="arrow-up-right" style="width: 18px; height: 18px;"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Built-in Store & App Logic -->
  <script>
    const STORAGE_KEY = 'postlain_portal_data_v4';
    const DEFAULT_DATA = {
      about: {
        title: "HỒ SƠ KẺ ẨN DANH // THE ARCHITECT",
        alias: "ANONYMOUS_ARCHITECT",
        quote: "Trong một thế giới đầy rẫy sự kiểm soát, chúng ta kiến tạo những không gian tự do.",
        content: "Tôi là một kẻ ẩn danh đứng sau những dòng mã và những tần số âm thanh của Postlain.\n\nMục đích duy nhất của tôi khi tạo ra chuỗi website và công cụ này là thiết lập một mạng lưới độc lập – nơi bất kỳ ai cũng có thể sáng tạo âm nhạc chất lượng phòng thu, khai thác sức mạnh của trí tuệ nhân tạo, và kết nối với những người cùng tần số mà không bị ràng buộc bởi bất kỳ nền tảng độc quyền nào.\n\nMỗi cổng kết nối (Portal) là một vũ khí công nghệ được trau chuốt tỉ mỉ. Hãy sử dụng những công cụ này để tạo nên những điều phi thường."
      },
      portals: [
        { id: "postlain-music", title: "POSTLAIN MUSIC", url: "https://music.postlain.com", tagline: "Nền tảng stream âm thanh Hi-Res Lossless chuẩn phòng thu.", icon: "disc-3", status: "ONLINE", order: 1, clicks: 1420 },
        { id: "postlain-studio", title: "STUDIO DAW", url: "https://studio.postlain.com", tagline: "Phòng thu âm thanh & trạm phối khí kỹ thuật số trực tiếp trên trình duyệt.", icon: "sliders", status: "ONLINE", order: 2, clicks: 980 },
        { id: "postlain-ai-lab", title: "AI SOUND LAB", url: "https://ai.postlain.com", tagline: "Trí tuệ nhân tạo tách Stem giọng hát, trích xuất beat và phân tích phổ tần số.", icon: "sparkles", status: "ONLINE", order: 3, clicks: 2150 },
        { id: "postlain-store", title: "SOUND VAULT", url: "https://store.postlain.com", tagline: "Kho sound kit, loop mẫu bản quyền và preset synthesizer chuyên sâu.", icon: "box", status: "ONLINE", order: 4, clicks: 640 },
        { id: "postlain-community", title: "HUB COMMUNITY", url: "https://hub.postlain.com", tagline: "Mạng lưới kết nối kín giữa các nhà sáng tạo âm nhạc và lập trình viên.", icon: "users", status: "ONLINE", order: 5, clicks: 530 },
        { id: "postlain-tools", title: "AUDIO SUITE", url: "https://tools.postlain.com", tagline: "Bộ công cụ chuyển đổi định dạng, cắt ghép và tối ưu metadata âm thanh.", icon: "wand-2", status: "ONLINE", order: 6, clicks: 710 },
        { id: "postlain-lyrics", title: "LYRIC SYNC", url: "https://lyrics.postlain.com", tagline: "Trình tạo lời bài hát đồng bộ thời gian thực (.lrc / .srt).", icon: "mic-2", status: "BETA", order: 7, clicks: 420 },
        { id: "postlain-docs", title: "CORE API // SDK", url: "https://docs.postlain.com", tagline: "Tài liệu kỹ thuật và cổng API mở cho lập trình viên tích hợp.", icon: "terminal", status: "ONLINE", order: 8, clicks: 310 }
      ]
    };

    function getStoreData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.portals) && parsed.portals.length > 0) return parsed;
        }
      } catch (e) {}
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
      return DEFAULT_DATA;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const modeGateBtn = document.getElementById('mode-gate-btn');
      const modeAboutBtn = document.getElementById('mode-about-btn');
      const sectionGate = document.getElementById('section-gate');
      const sectionAbout = document.getElementById('section-about');
      const bigSquareGrid = document.getElementById('big-square-grid');

      const previewBackdrop = document.getElementById('center-preview-backdrop');
      const previewPanel = document.getElementById('center-preview-panel');
      const previewCloseBtn = document.getElementById('preview-close-btn');
      const previewFeedId = document.getElementById('preview-feed-id');
      const previewScreenContent = document.getElementById('preview-screen-content');
      const previewTaglineText = document.getElementById('preview-tagline-text');
      const previewUrlText = document.getElementById('preview-url-text');
      const previewLaunchBtn = document.getElementById('preview-launch-btn');

      let hoverTimeout = null;

      // Switcher
      modeGateBtn.addEventListener('click', () => {
        modeGateBtn.classList.add('active');
        modeAboutBtn.classList.remove('active');
        sectionGate.classList.add('active');
        sectionAbout.classList.remove('active');
        if (window.lucide) window.lucide.createIcons();
      });

      modeAboutBtn.addEventListener('click', () => {
        modeAboutBtn.classList.add('active');
        modeGateBtn.classList.remove('active');
        sectionAbout.classList.add('active');
        sectionGate.classList.remove('active');
        if (window.lucide) window.lucide.createIcons();
      });

      // Render
      function renderPage() {
        const data = getStoreData();

        // Render Portals
        bigSquareGrid.innerHTML = data.portals.map((p, idx) => `
          <div class="big-square-card" data-id="${p.id}">
            <div class="card-top-hud">
              <span class="card-index">[ GATE_${(idx + 1).toString().padStart(2, '0')} ]</span>
              <span class="card-status-pill"><span class="dot"></span><span>${p.status || 'ONLINE'}</span></span>
            </div>
            <div class="card-center-reactor">
              <div class="big-reactor-icon"><i data-lucide="${p.icon || 'globe'}" style="width: 44px; height: 44px;"></i></div>
              <div class="big-card-title">${p.title}</div>
            </div>
            <div class="card-bottom-hud">
              <span>NODE // 0${idx + 1}</span>
              <span class="hover-open-hint"><span>XEM TRƯỚC</span><i data-lucide="arrow-up-right" style="width: 16px; height: 16px;"></i></span>
            </div>
          </div>
        `).join('');

        // Render About
        const about = data.about || DEFAULT_DATA.about;
        document.getElementById('about-title').textContent = about.title || 'HỒ SƠ KẺ ẨN DANH';
        document.getElementById('about-alias').textContent = `[ BÍ DANH: ${about.alias || 'ANONYMOUS_ARCHITECT'} ]`;
        document.getElementById('about-quote').textContent = `"${about.quote || ''}"`;
        document.getElementById('about-content').textContent = about.content || '';

        // Attach Card Interactions
        bigSquareGrid.querySelectorAll('.big-square-card').forEach(card => {
          const id = card.getAttribute('data-id');
          card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            card.style.transform = `perspective(1000px) rotateX(${-(y / rect.height) * 12}deg) rotateY(${(x / rect.width) * 12}deg) scale3d(1.03, 1.03, 1.03)`;
          });
          card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
          });
          card.addEventListener('mouseenter', () => {
            clearTimeout(hoverTimeout);
            openPreview(id);
          });
          card.addEventListener('click', () => openPreview(id));
        });

        if (window.lucide) window.lucide.createIcons();
      }

      function openPreview(id) {
        const data = getStoreData();
        const p = data.portals.find(item => item.id === id);
        if (!p) return;

        previewFeedId.textContent = `[ DIRECT_FEED // GATE_${p.id.toUpperCase()} ]`;
        previewTaglineText.textContent = p.tagline || 'Cổng kết nối dịch vụ trực tuyến.';
        previewUrlText.textContent = p.url;
        previewLaunchBtn.href = p.url;

        previewScreenContent.innerHTML = `
          <div style="width: 60px; height: 60px; border-radius: 50%; background: #161622; border: 2px solid #ff003c; display: flex; align-items: center; justify-content: center; color: #ff003c; box-shadow: 0 0 25px rgba(255, 0, 60, 0.5);">
            <i data-lucide="${p.icon || 'globe'}" style="width: 32px; height: 32px;"></i>
          </div>
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 1.35rem; font-weight: 800; color: #fff; letter-spacing: 1px;">${p.title}</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: #ff003c;">🔗 ${p.url}</div>
        `;

        previewBackdrop.classList.add('active');
        if (window.lucide) window.lucide.createIcons();
      }

      function closePreview() {
        previewBackdrop.classList.remove('active');
      }

      previewCloseBtn.addEventListener('click', closePreview);
      previewBackdrop.addEventListener('click', (e) => { if (e.target === previewBackdrop) closePreview(); });
      previewPanel.addEventListener('mouseleave', () => { hoverTimeout = setTimeout(closePreview, 400); });
      previewPanel.addEventListener('mouseenter', () => clearTimeout(hoverTimeout));
      window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePreview(); });

      renderPage();
    });
  </script>
</body>
</html>
