<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postlain Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #070709;
      color: #e5e5e5;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Auth Gate */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: #070709;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-overlay.hidden { display: none !important; }
    .auth-card {
      background: #111116;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 36px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.8);
    }
    .auth-input {
      width: 100%;
      padding: 10px;
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-align: center;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #fff;
      margin: 16px 0;
      outline: none;
    }
    .auth-input:focus { border-color: rgba(255, 255, 255, 0.3); }

    /* Layout */
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px;
    }
    .admin-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: #a3a3a3;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn:hover, .tab-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: rgba(255,255,255,0.2); }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary { background: #ffffff; color: #000000; }
    .btn-primary:hover { background: #e5e5e5; }
    .btn-secondary { background: #1c1c24; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }

    /* Table */
    .table-box {
      background: #111116;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 16px;
    }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th {
      background: #17171e;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: #a3a3a3;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.9rem;
    }
    .data-table tr:hover td { background: #17171e; }

    /* Forms */
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: #a3a3a3; }
    .form-input, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: rgba(255, 255, 255, 0.3); }

    .section-tab { display: none; }
    .section-tab.active { display: block; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex !important; }
    .modal-card {
      background: #111116;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      max-width: 500px;
      width: 100%;
    }
    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-body { padding: 18px; }
    .modal-footer {
      padding: 12px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #17171e;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 6px;
      color: #fff;
      display: none;
      z-index: 10000;
    }
  </style>
</head>
<body>
  <!-- PIN Gate -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-card">
      <h2 style="color: #fff; margin-bottom: 6px;">Postlain Admin</h2>
      <p style="color: #a3a3a3; font-size: 0.85rem;">Nhập mã PIN truy cập</p>
      <input type="password" id="pin-input" class="auth-input" placeholder="••••" maxlength="8" autofocus>
      <button id="pin-submit" class="btn btn-primary" style="width: 100%;">ĐĂNG NHẬP</button>
      <div style="font-size: 0.75rem; color: #737373; margin-top: 10px;">Mặc định: 1234</div>
    </div>
  </div>

  <div class="admin-container">
    <header class="admin-nav-bar">
      <div class="nav-tabs">
        <button class="tab-btn active" data-tab="portals">4 Khung Dự Án</button>
        <button class="tab-btn" data-tab="about">Nội Dung About</button>
        <button class="tab-btn" data-tab="backup">Sao Lưu JSON</button>
      </div>
      <div style="display: flex; gap: 8px;">
        <a href="/" target="_blank" class="btn btn-secondary btn-sm">Xem Trang Chủ</a>
        <button id="btn-logout" class="btn btn-danger btn-sm">Đăng Xuất</button>
      </div>
    </header>

    <main>
      <!-- TAB 1: 4 DỰ ÁN -->
      <section id="tab-portals" class="section-tab active">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 1.2rem; color: #fff;">Quản Lý 4 Cửa Sổ Live Website (Grid 2x2)</h2>
          <button id="btn-add-item" class="btn btn-primary btn-sm">+ Thêm / Sửa Dự Án</button>
        </div>

        <div class="table-box">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 50px;">#</th>
                <th>Tên Dự Án</th>
                <th>URL Website</th>
                <th>Link Ảnh (Tùy chọn)</th>
                <th>Mô Tả</th>
                <th style="width: 120px;">Thao Tác</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </section>

      <!-- TAB 2: ABOUT -->
      <section id="tab-about" class="section-tab">
        <h2 style="font-size: 1.2rem; color: #fff; margin-bottom: 16px;">Soạn Thảo Giới Thiệu</h2>
        <form id="about-form" style="max-width: 680px;">
          <div class="form-group">
            <label>Tiêu Đề</label>
            <input type="text" id="about-title" class="form-input">
          </div>
          <div class="form-group">
            <label>Bí Danh (Alias)</label>
            <input type="text" id="about-alias" class="form-input">
          </div>
          <div class="form-group">
            <label>Câu Trích Dẫn (Quote)</label>
            <input type="text" id="about-quote" class="form-input">
          </div>
          <div class="form-group">
            <label>Nội Dung</label>
            <textarea id="about-content" class="form-textarea" rows="8"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Lưu Nội Dung</button>
        </form>
      </section>

      <!-- TAB 3: BACKUP -->
      <section id="tab-backup" class="section-tab">
        <h2 style="font-size: 1.2rem; color: #fff; margin-bottom: 16px;">Xuất & Nhập JSON</h2>
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <button id="btn-download-json" class="btn btn-primary btn-sm">Tải portals.json</button>
          <button id="btn-copy-json" class="btn btn-secondary btn-sm">Sao Chép JSON</button>
        </div>
        <div class="form-group" style="max-width: 400px; margin-bottom: 16px;">
          <label>Nhập file JSON:</label>
          <input type="file" id="import-file" accept=".json">
        </div>
        <pre id="json-viewer" style="background: #000; border: 1px solid rgba(255,255,255,0.08); padding: 14px; border-radius: 6px; font-size: 0.82rem; color: #a3a3a3; max-height: 320px; overflow-y: auto;"></pre>
      </section>
    </main>
  </div>

  <!-- MODAL EDIT/ADD -->
  <div id="modal-portal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size: 1rem; color: #fff;">Chỉnh Sửa Dự Án</h3>
        <button type="button" class="btn-close-modal" style="background: transparent; border: none; color: #a3a3a3; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <form id="portal-form">
        <div class="modal-body">
          <input type="hidden" id="form-id">
          <div class="form-group">
            <label>1. Tên Dự Án *</label>
            <input type="text" id="form-title" class="form-input" placeholder="VD: HIDDEN MUSIC" required>
          </div>
          <div class="form-group">
            <label>2. URL Website (Để trống nếu muốn hiển thị 'Đang trong thời gian phát triển')</label>
            <input type="text" id="form-url" class="form-input" placeholder="https://hiddenmusic.postlain.com">
          </div>
          <div class="form-group">
            <label>3. Link Ảnh Preview (Tùy chọn - nếu muốn thay thế Live Iframe bằng ảnh)</label>
            <input type="text" id="form-image" class="form-input" placeholder="https://... hoặc để trống">
          </div>
          <div class="form-group">
            <label>4. Mô Tả Ngắn Gọn *</label>
            <input type="text" id="form-desc" class="form-input" placeholder="VD: Âm Nhạc Ẩn" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-close-modal">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu Dự Án</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-box" class="toast"></div>

  <script>
    const STORAGE_KEY = 'postlain_data_v11';
    const AUTH_KEY = 'postlain_admin_logged_v11';
    const DEFAULT_PIN = '1234';

    const DEFAULT_DATA = {
      about: {
        title: "Giới Thiệu // The Architect",
        alias: "ANONYMOUS_CREATOR",
        quote: "Trong một thế giới đầy rẫy sự kiểm soát, chúng ta kiến tạo những không gian tự do.",
        content: "Tôi là một kẻ ẩn danh đứng sau những dòng mã và những tần số âm thanh của Postlain.\n\nMục đích duy nhất của tôi khi tạo ra chuỗi website và công cụ này là thiết lập một mạng lưới độc lập – nơi bất kỳ ai cũng có thể sáng tạo âm nhạc chất lượng phòng thu, khai thác sức mạnh của trí tuệ nhân tạo, và kết nối với những người cùng tần số mà không bị ràng buộc bởi bất kỳ nền tảng độc quyền nào.\n\nMỗi cổng kết nối là một công cụ độc lập được trau chuốt tỉ mỉ. Hãy sử dụng những công cụ này để tạo nên những điều phi thường."
      },
      portals: [
        { id: "project-1", title: "HIDDEN MUSIC", url: "https://hiddenmusic.postlain.com", image: "", desc: "Âm Nhạc Ẩn" },
        { id: "project-2", title: "POSTLAIN MUSIC", url: "", image: "", desc: "Dịch vụ stream âm thanh Hi-Res Lossless chuẩn phòng thu." },
        { id: "project-3", title: "STUDIO DAW", url: "", image: "", desc: "Trạm thu âm & phối khí kỹ thuật số trực tuyến." },
        { id: "project-4", title: "AI SOUND LAB", url: "", image: "", desc: "Công cụ tách Stem giọng hát và xử lý phổ âm thanh AI." }
      ]
    };

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.portals) && parsed.portals.length > 0) return parsed;
        }
      } catch (e) {}
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
      return DEFAULT_DATA;
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function showToast(msg) {
      const el = document.getElementById('toast-box');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 2200);
    }

    document.addEventListener('DOMContentLoaded', () => {
      let currentData = loadData();

      const authOverlay = document.getElementById('auth-overlay');
      const pinInput = document.getElementById('pin-input');
      const pinSubmit = document.getElementById('pin-submit');
      const btnLogout = document.getElementById('btn-logout');

      const tabBtns = document.querySelectorAll('.nav-tabs .tab-btn');
      const tabSections = document.querySelectorAll('.section-tab');

      const tbody = document.getElementById('table-body');
      const btnAdd = document.getElementById('btn-add-item');
      const modal = document.getElementById('modal-portal');
      const modalTitle = document.getElementById('modal-title');
      const form = document.getElementById('portal-form');
      const inpId = document.getElementById('form-id');
      const inpTitle = document.getElementById('form-title');
      const inpUrl = document.getElementById('form-url');
      const inpImage = document.getElementById('form-image');
      const inpDesc = document.getElementById('form-desc');

      const aboutForm = document.getElementById('about-form');
      const inpAboutTitle = document.getElementById('about-title');
      const inpAboutAlias = document.getElementById('about-alias');
      const inpAboutQuote = document.getElementById('about-quote');
      const inpAboutContent = document.getElementById('about-content');

      const jsonViewer = document.getElementById('json-viewer');
      const btnCopyJson = document.getElementById('btn-copy-json');
      const btnDownloadJson = document.getElementById('btn-download-json');
      const inpImport = document.getElementById('import-file');

      function checkAuth() {
        if (sessionStorage.getItem(AUTH_KEY) === 'true') {
          authOverlay.classList.add('hidden');
          renderAll();
        } else {
          authOverlay.classList.remove('hidden');
          pinInput.value = '';
          pinInput.focus();
        }
      }

      pinSubmit.addEventListener('click', () => {
        if (pinInput.value.trim() === DEFAULT_PIN) {
          sessionStorage.setItem(AUTH_KEY, 'true');
          authOverlay.classList.add('hidden');
          renderAll();
          showToast('Đăng nhập thành công!');
        } else {
          alert('Mã PIN không đúng.');
          pinInput.value = '';
          pinInput.focus();
        }
      });

      pinInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') pinSubmit.click();
      });

      btnLogout.addEventListener('click', () => {
        sessionStorage.removeItem(AUTH_KEY);
        checkAuth();
      });

      // Tabs
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.getAttribute('data-tab');
          tabBtns.forEach(b => b.classList.remove('active'));
          tabSections.forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-' + tab).classList.add('active');
          if (tab === 'backup') renderJson();
        });
      });

      function renderTable() {
        currentData = loadData();
        tbody.innerHTML = currentData.portals.map((p, idx) => `
          <tr>
            <td style="font-weight: 700; color: #737373;">${idx + 1}</td>
            <td style="font-weight: 700; color: #fff;">${p.title}</td>
            <td style="color: ${p.url ? '#ffffff' : '#737373'}; font-family: monospace; font-size: 0.82rem;">
              ${p.url ? p.url : '(Trống - Đang phát triển)'}
            </td>
            <td style="color: ${p.image ? '#4ade80' : '#737373'}; font-size: 0.8rem;">
              ${p.image ? p.image : '(Live View)'}
            </td>
            <td style="color: #a3a3a3;">${p.desc || ''}</td>
            <td>
              <div style="display: flex; gap: 6px;">
                <button class="btn btn-secondary btn-sm" onclick="editPortal('${p.id}')">Sửa</button>
                <button class="btn btn-danger btn-sm" onclick="deletePortal('${p.id}')">Xóa</button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      window.editPortal = function(id) {
        const p = currentData.portals.find(item => item.id === id);
        if (!p) return;
        modalTitle.textContent = 'Chỉnh Sửa Dự Án';
        inpId.value = p.id;
        inpTitle.value = p.title || '';
        inpUrl.value = p.url || '';
        inpImage.value = p.image || '';
        inpDesc.value = p.desc || '';
        modal.classList.add('active');
      };

      window.deletePortal = function(id) {
        if (confirm('Bạn có chắc muốn xóa dự án này?')) {
          currentData.portals = currentData.portals.filter(p => p.id !== id);
          saveData(currentData);
          renderTable();
          showToast('Đã xóa thành công!');
        }
      };

      btnAdd.addEventListener('click', () => {
        modalTitle.textContent = 'Thêm Dự Án Mới';
        form.reset();
        inpId.value = '';
        modal.classList.add('active');
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = inpId.value.trim();
        const title = inpTitle.value.trim();
        const url = inpUrl.value.trim();
        const image = inpImage.value.trim();
        const desc = inpDesc.value.trim();

        if (id) {
          const idx = currentData.portals.findIndex(p => p.id === id);
          if (idx >= 0) currentData.portals[idx] = { id, title, url, image, desc };
        } else {
          currentData.portals.push({ id: 'project-' + Date.now(), title, url, image, desc });
        }

        saveData(currentData);
        modal.classList.remove('active');
        renderTable();
        showToast('Đã lưu thành công!');
      });

      function renderAbout() {
        const a = currentData.about || DEFAULT_DATA.about;
        inpAboutTitle.value = a.title || '';
        inpAboutAlias.value = a.alias || '';
        inpAboutQuote.value = a.quote || '';
        inpAboutContent.value = a.content || '';
      }

      aboutForm.addEventListener('submit', (e) => {
        e.preventDefault();
        currentData.about = {
          title: inpAboutTitle.value.trim(),
          alias: inpAboutAlias.value.trim(),
          quote: inpAboutQuote.value.trim(),
          content: inpAboutContent.value.trim()
        };
        saveData(currentData);
        showToast('Đã lưu nội dung About!');
      });

      function renderJson() {
        jsonViewer.textContent = JSON.stringify(currentData, null, 2);
      }

      btnCopyJson.addEventListener('click', () => {
        navigator.clipboard.writeText(JSON.stringify(currentData, null, 2)).then(() => showToast('Đã sao chép JSON!'));
      });

      btnDownloadJson.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'portals.json';
        a.click();
        showToast('Đã tải portals.json!');
      });

      inpImport.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (parsed && Array.isArray(parsed.portals)) {
              currentData = parsed;
              saveData(currentData);
              renderAll();
              showToast('Nhập JSON thành công!');
            }
          } catch(err) { alert('Lỗi file JSON'); }
        };
        r.readAsText(file);
      });

      document.querySelectorAll('.btn-close-modal').forEach(btn => {
        btn.addEventListener('click', () => modal.classList.remove('active'));
      });

      function renderAll() {
        renderTable();
        renderAbout();
        renderJson();
      }

      checkAuth();
    });
  </script>
</body>
</html>
